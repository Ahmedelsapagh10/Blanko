name: Blanko Release

on:
  workflow_dispatch:
    inputs:
      android_only:
        description: Validate Android signing and upload a candidate without publishing
        type: boolean
        default: true
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Require an explicit beta tag for unsigned preview publishing
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || {
            echo "Stable releases require durable Android signing and desktop signing review."
            exit 1
          }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build macOS
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Verify macOS Release startup before packaging
        shell: bash
        run: |
          build/macos/Build/Products/Release/Blanko.app/Contents/MacOS/Blanko > release-startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 8
          kill -0 "$app_pid"
      - name: Package macOS App
        run: |
          cd build/macos/Build/Products/Release
          if [ -d "Blanko.app" ]; then
            zip -r -y Blanko-macOS.zip "Blanko.app"
          else
            zip -r -y Blanko-macOS.zip *.app
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blanko-macOS
          path: build/macos/Build/Products/Release/Blanko-macOS.zip

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build Linux
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Verify Linux Release startup before packaging
        shell: bash
        run: |
          xvfb-run -a bash -c '
            build/linux/x64/release/bundle/whiteboard > release-startup.log 2>&1 &
            app_pid=$!
            trap '\''kill "$app_pid" 2>/dev/null || true'\'' EXIT
            sleep 8
            kill -0 "$app_pid"
          '
      - name: Package Linux bundle
        run: |
          cd build/linux/x64/release
          tar -czf Blanko-Linux-x64.tar.gz bundle/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blanko-Linux-x64
          path: build/linux/x64/release/Blanko-Linux-x64.tar.gz

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build Windows
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Verify Windows Release window before packaging
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path 'build/windows/x64/runner/Release/whiteboard.exe') -PassThru
          try {
            Start-Sleep -Seconds 8
            $app.Refresh()
            if ($app.HasExited) { throw "Release exited unexpectedly: $($app.ExitCode)" }
            if ($app.MainWindowHandle -eq 0) { throw 'Release did not create a native window' }
          } finally {
            if (!$app.HasExited) { $null = $app.CloseMainWindow(); if (!$app.WaitForExit(5000)) { $app.Kill() } }
          }
      - name: Package Windows bundle
        shell: pwsh
        run: |
          if (Test-Path "build\windows\x64\runner\Release") {
            Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Blanko-Windows-x64.zip"
          } else {
            Compress-Archive -Path "build\windows\runner\Release\*" -DestinationPath "Blanko-Windows-x64.zip"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blanko-Windows-x64
          path: Blanko-Windows-x64.zip

  build-android:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.android_only)
    name: Build Android APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare owner-provided Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BLANKO_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BLANKO_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLANKO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BLANKO_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
              echo 'All four Android signing secrets must be provided together.'
              exit 1
            }
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/blanko-release.keystore"
            echo "BLANKO_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/blanko-release.keystore" >> "$GITHUB_ENV"
            certificate=$(keytool -exportcert -keystore "$RUNNER_TEMP/blanko-release.keystore" -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD | sha256sum | cut -d ' ' -f 1)
            expected=$(tr -d '[:space:]' < android/release-certificate.sha256)
            echo "Loaded owner certificate SHA-256: $certificate"
            test "$certificate" = "$expected" || { echo 'Configured keystore differs from the approved release identity.'; exit 1; }
          else
            echo '::error::Publishing requires the owner-provided Android release signing secrets.'
            exit 1
          fi
      - run: flutter build apk --release
        env:
          BLANKO_ANDROID_STORE_PASSWORD: ${{ secrets.BLANKO_ANDROID_STORE_PASSWORD }}
          BLANKO_ANDROID_KEY_ALIAS: ${{ secrets.BLANKO_ANDROID_KEY_ALIAS }}
          BLANKO_ANDROID_KEY_PASSWORD: ${{ secrets.BLANKO_ANDROID_KEY_PASSWORD }}
      - name: Verify Android release signing identity
        shell: bash
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$signer"
          actual=$("$signer" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | awk -F ': ' '/Signer #1 certificate SHA-256 digest:/ { print $2 }')
          expected=$(tr -d '[:space:]' < android/release-certificate.sha256)
          echo "Verification tool: $signer"
          echo "APK certificate SHA-256: $actual"
          echo "Approved certificate SHA-256: $expected"
          test "$actual" = "$expected" || { echo 'Android signing certificate does not match the approved release identity.'; exit 1; }
          echo "Verified Android release certificate: $actual"
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/blanko-release.keystore"
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk Blanko-Android.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blanko-Android
          path: Blanko-Android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish Release
    permissions:
      contents: write
    needs: [build-macos, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blanko-macOS
          path: artifacts/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blanko-Linux-x64
          path: artifacts/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blanko-Windows-x64
          path: artifacts/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blanko-Android
          path: artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum Blanko-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "Blanko ${{ github.ref_name }} — نسخة تجريبية عامة"
          prerelease: true
          generate_release_notes: false
          body: |
            <div dir="rtl" align="right">

            # 🎨 Blanko ${{ github.ref_name }}

            **نسخة تجريبية عامة — Public Beta**

            سبورة رقمية مفتوحة المصدر، مبنية بـ Flutter، تعمل بدون إنترنت.

            ## ✨ الميزات الرئيسية

            - لوحة رسم لانهائية مع تكبير وتحريك سلس
            - أقلام، هايلايتر، ممحاة، أشكال وأسهم
            - نصوص عربية/إنجليزية وملاحظات لاصقة
            - استيراد صور وتحريرها
            - إطارات، تجميع وتحرير متقدم
            - تراجع/إعادة وحفظ تلقائي محلي
            - تصدير PNG بدقة مخصصة حتى 4K
            - ملفات مشاريع `.wboard` قابلة للنقل
            - وضع داكن، فاتح، وتلقائي

            ## 📦 التحميل

            | المنصة | الملف |
            |--------|-------|
            | 🪟 Windows | `Blanko-Windows-x64.zip` |
            | 🐧 Linux | `Blanko-Linux-x64.tar.gz` |
            | 🍎 macOS | `Blanko-macOS.zip` |
            | 📱 Android | `Blanko-Android.apk` |
            | 🔐 Checksums | `SHA256SUMS.txt` |

            ## 📝 ملاحظات التثبيت

            **Windows**: فك الضغط وشغّل `whiteboard.exe`
            **Linux**: فك الضغط وشغّل `bundle/whiteboard`
            **macOS**: فك الضغط واسحب التطبيق إلى Applications (غير موثّق من Apple)
            **Android**: فعّل التثبيت من مصادر خارجية وثبّت الـ APK

            ## ⚠️ ملاحظات النسخة التجريبية

            - تطبيق macOS غير موثّق — قد تحتاج لفتحه من الإعدادات
            - APK Android موقّع بمفتاح إصدار المالك الثابت؛ CI يتحقق من بصمة الشهادة قبل النشر. توقيع beta.1 القديم مختلف: صدّر مشاريعك قبل أي إزالة أو إعادة تثبيت، ولا تمسح البيانات لتجاوز اختلاف التوقيع
            - Windows وLinux وmacOS: اختبارات المحرر داخل المحرك وتشغيل Release متحققة في CI؛ تم توصيل ملفات Windows/Linux بالنظام. اختيار الملفات يدويًا وتوافق الأجهزة الأوسع يظلان ضمن اختبارات النسخة التجريبية
            - الحفظ التلقائي ليس نسخة احتياطية؛ احتفظ بنسخ `.wboard` خارج بيانات التطبيق
            - لم يُختبر على أجهزة لوحية أو أقلام رقمية بعد
            - أبلغ عن المشاكل عبر [GitHub Issues](https://github.com/Ahmedelsapagh10/Blanko/issues)

            </div>
          fail_on_unmatched_files: true
          files: |
            artifacts/Blanko-macOS.zip
            artifacts/Blanko-Linux-x64.tar.gz
            artifacts/Blanko-Windows-x64.zip
            artifacts/Blanko-Android.apk
            artifacts/SHA256SUMS.txt
      - name: Verify actual public downloads
        shell: bash
        run: |
          mkdir verified-downloads
          for name in Blanko-macOS.zip Blanko-Linux-x64.tar.gz Blanko-Windows-x64.zip Blanko-Android.apk SHA256SUMS.txt; do
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name" \
              --output "verified-downloads/$name"
          done
          cd verified-downloads
          sha256sum --check SHA256SUMS.txt
          unzip -tq Blanko-macOS.zip
          unzip -tq Blanko-Windows-x64.zip
          unzip -tq Blanko-Android.apk
          tar -tzf Blanko-Linux-x64.tar.gz > /dev/null
