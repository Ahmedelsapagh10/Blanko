name: Blanko Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-macos:
    name: Build macOS
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y Blanko-macOS.zip "whiteboard.app"
      - uses: actions/upload-artifact@v4
        with:
          name: Blanko-macOS
          path: build/macos/Build/Products/Release/Blanko-macOS.zip

  build-linux:
    name: Build Linux
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux bundle
        run: |
          cd build/linux/x64/release
          tar -czf Blanko-Linux-x64.tar.gz bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: Blanko-Linux-x64
          path: build/linux/x64/release/Blanko-Linux-x64.tar.gz

  build-windows:
    name: Build Windows
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Blanko-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Blanko-Windows-x64
          path: Blanko-Windows-x64.zip

  build-android:
    name: Build Android APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk Blanko-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Blanko-Android
          path: Blanko-Android.apk

  release:
    name: Publish Release
    needs: [build-macos, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Blanko-macOS
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: Blanko-Linux-x64
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: Blanko-Windows-x64
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: Blanko-Android
          path: artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Blanko ${{ github.ref_name }} — نسخة تجريبية عامة"
          prerelease: true
          generate_release_notes: false
          body: |
            <div dir="rtl" align="right">

            # 🎨 Blanko ${{ github.ref_name }}

            **نسخة تجريبية عامة — Public Beta**

            سبورة رقمية مفتوحة المصدر، مبنية بـ Flutter، تعمل بدون إنترنت.

            ## ✨ الميزات الرئيسية

            - لوحة رسم لانهائية مع تكبير وتحريك سلس
            - أقلام، هايلايتر، ممحاة، أشكال وأسهم
            - نصوص عربية/إنجليزية وملاحظات لاصقة
            - استيراد صور وتحريرها
            - إطارات، تجميع وتحرير متقدم
            - تراجع/إعادة وحفظ تلقائي محلي
            - تصدير PNG بدقة مخصصة حتى 4K
            - ملفات مشاريع `.wboard` قابلة للنقل
            - وضع داكن، فاتح، وتلقائي

            ## 📦 التحميل

            | المنصة | الملف |
            |--------|-------|
            | 🪟 Windows | `Blanko-Windows-x64.zip` |
            | 🐧 Linux | `Blanko-Linux-x64.tar.gz` |
            | 🍎 macOS | `Blanko-macOS.zip` |
            | 📱 Android | `Blanko-Android.apk` |
            | 🔐 Checksums | `SHA256SUMS.txt` |

            ## 📝 ملاحظات التثبيت

            **Windows**: فك الضغط وشغّل `whiteboard.exe`
            **Linux**: فك الضغط وشغّل `bundle/whiteboard`
            **macOS**: فك الضغط واسحب التطبيق إلى Applications (غير موثّق من Apple)
            **Android**: فعّل التثبيت من مصادر خارجية وثبّت الـ APK

            ## ⚠️ ملاحظات النسخة التجريبية

            - تطبيق macOS غير موثّق — قد تحتاج لفتحه من الإعدادات
            - APK Android موقّع بمفتاح Debug — للتجربة فقط
            - لم يُختبر على أجهزة لوحية أو أقلام رقمية بعد
            - أبلغ عن المشاكل عبر [GitHub Issues](https://github.com/Ahmedelsapagh10/whitebaord/issues)

            </div>
          files: |
            artifacts/Blanko-macOS.zip
            artifacts/Blanko-Linux-x64.tar.gz
            artifacts/Blanko-Windows-x64.zip
            artifacts/Blanko-Android.apk
            artifacts/SHA256SUMS.txt
