name: Native Platform Verification

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'windows/**'
      - 'linux/**'
      - 'macos/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.*'
      - '.github/workflows/platform-verification.yml'
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  native-desktop:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - run: flutter pub get
      - name: Host regressions on this operating system
        run: flutter test --no-pub
      - name: Native engine integration (Debug)
        if: runner.os != 'Linux'
        run: flutter test --no-pub integration_test/platform_smoke_test.dart -d ${{ matrix.target }}
      - name: Native Linux engine integration (Debug, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a flutter test --no-pub integration_test/platform_smoke_test.dart -d linux
      - name: Build normal Release entry point
        run: flutter build ${{ matrix.target }} --release --no-pub
      - name: Windows Release startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path 'build/windows/x64/runner/Release/whiteboard.exe') -PassThru
          try {
            Start-Sleep -Seconds 8
            $app.Refresh()
            if ($app.HasExited) { throw "Release exited unexpectedly: $($app.ExitCode)" }
            if ($app.MainWindowHandle -eq 0) { throw 'Release did not create a native window' }
          } finally {
            if (!$app.HasExited) { $null = $app.CloseMainWindow(); if (!$app.WaitForExit(5000)) { $app.Kill() } }
          }
      - name: macOS Release startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          build/macos/Build/Products/Release/Blanko.app/Contents/MacOS/Blanko > release-startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 8
          kill -0 "$app_pid"
      - name: Linux Release startup (Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a bash -c '
            build/linux/x64/release/bundle/whiteboard > release-startup.log 2>&1 &
            app_pid=$!
            trap '\''kill "$app_pid" 2>/dev/null || true'\'' EXIT
            sleep 8
            kill -0 "$app_pid"
          '
      - name: Package verified Windows Release
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath Blanko-Windows-x64.zip
      - name: Package verified macOS Release
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/Blanko.app Blanko-macOS.zip
      - name: Package verified Linux Release
        if: runner.os == 'Linux'
        run: tar -czf Blanko-Linux-x64.tar.gz -C build/linux/x64/release bundle
      - name: Upload verified desktop candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-${{ matrix.target }}-release
          path: |
            Blanko-*.zip
            Blanko-*.tar.gz
          if-no-files-found: error
      - name: Preserve startup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}-diagnostics
          path: |
            release-startup.log
          if-no-files-found: ignore

  native-android:
    name: Native Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare disposable Android device
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          adb start-server
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-36;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n blanko-ci -k 'system-images;android-36;google_apis;x86_64'
          sudo chown "$USER" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd blanko-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > emulator-startup.log 2>&1 &
          for attempt in $(seq 1 150); do
            if adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -q 1; then exit 0; fi
            sleep 2
          done
          cat emulator-startup.log
          exit 1
      - name: Native Android engine integration (Debug)
        run: flutter test --no-pub integration_test/platform_smoke_test.dart -d emulator-5554
      - name: Build and launch normal Android Release
        shell: bash
        run: |
          flutter build apk --release --no-pub
          adb install -r build/app/outputs/flutter-apk/app-release.apk
          adb shell am start -W -n ahmedelsapagh.com.whiteboard/ahmedelsapagh.com.whiteboard.MainActivity
          sleep 8
          adb shell pidof ahmedelsapagh.com.whiteboard
          adb shell am force-stop ahmedelsapagh.com.whiteboard
          adb shell am start -W -n ahmedelsapagh.com.whiteboard/ahmedelsapagh.com.whiteboard.MainActivity
          sleep 4
          adb shell pidof ahmedelsapagh.com.whiteboard
      - name: Upload verified Android candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Preserve Android diagnostics
        if: always()
        shell: bash
        run: adb logcat -d > android-runtime.log || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-android-diagnostics
          path: |
            emulator-startup.log
            android-runtime.log
          if-no-files-found: ignore
